.food-cat{

.kcal{

}

.macros{

}

.macros span{

}

.food-actions{
display:flex;

.food-actions button{
flex:1;

padding:10px;
border-radius:14px;

.add-btn{
background:#4f46e5;

.fav-btn{

border-radius:16px;
background:#e2e8f0;
font-weight:800;

}

/* ================= MEAL ================= */

.meal-group{

.meal-list{

/* ========================================================= */

let visible = 18;
let currentCategory = "all";
let currentMeal = "breakfast";

let meals = JSON.parse(localStorage.getItem("meals")) || {
breakfast:[],
lunch:[],
dinner:[],
snack:[]
};

let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

/* ================= FILTER ================= */

function renderFilters(){

const cats = ["all",...new Set(foods.map(f=>f.cat))];

const wrap = document.getElementById("filters");

wrap.innerHTML="";

cats.forEach(cat=>{

wrap.innerHTML += `
<button
class="${currentCategory===cat?'active':''}"
onclick="changeCategory('${cat}')"
>
${cat}
</button>
`;

});

}

function changeCategory(cat){

currentCategory = cat;

renderFilters();

renderFoods();

}

/* ================= FOODS ================= */

function renderFoods(){

const grid = document.getElementById("foodGrid");

grid.innerHTML="";

const search =
document.getElementById("search")
.value.toLowerCase();

let filtered = foods.filter(f=>
f.name.toLowerCase().includes(search)
);

if(currentCategory!=="all"){

filtered =
filtered.filter(f=>f.cat===currentCategory);

}

filtered.slice(0,visible).forEach(food=>{

grid.innerHTML += `

<div class="food-card">

<div class="food-head">

<div>

<div class="food-name">
${food.icon} ${food.name}
</div>

<div class="food-cat">
${food.cat}
</div>

</div>

</div>

<div class="kcal">
${food.cal} kcal / 100g
</div>

<div class="macros">
<span>🥩 ${food.protein}P</span>
<span>🍚 ${food.carb}C</span>
<span>🥑 ${food.fat}F</span>
</div>

<div class="food-actions">

<button
class="add-btn"
onclick='addFood(${JSON.stringify(food)})'
>
Thêm
</button>

<button
class="fav-btn"
onclick='addFavorite(${JSON.stringify(food)})'
>
❤️
</button>

</div>

</div>

`;

});

/* ================= ADD FOOD ================= */

function addFood(food){

const gram = prompt(`Nhập gram cho ${food.name}`);

if(!gram) return;

const factor = gram/100;

meals[currentMeal].push({

...food,

gram,

totalCal:Math.round(food.cal*factor),
totalProtein:Math.round(food.protein*factor),
totalFat:Math.round(food.fat*factor),
totalCarb:Math.round(food.carb*factor)

});

saveData();

renderMeals();

}

/* ================= REMOVE ================= */

function removeFood(type,index){

meals[type].splice(index,1);

saveData();

renderMeals();

}

/* ================= MEALS ================= */

function renderMeals(){

const wrap = document.getElementById("mealContainer");

wrap.innerHTML="";

const names = {
breakfast:"🌅 Bữa sáng",
lunch:"☀️ Bữa trưa",
dinner:"🌙 Bữa tối",
snack:"🍓 Bữa phụ"
};

let totalCal=0;
let totalProtein=0;
let totalCarb=0;
let totalFat=0;

Object.keys(meals).forEach(type=>{

wrap.innerHTML += `

<div class="meal-group">

<h3>${names[type]}</h3>

<div class="meal-list">

${meals[type].map((food,index)=>`

<div class="meal-item">

<div class="meal-info">

<b>
${food.icon} ${food.name}
</b>

<span>
${food.gram}g • ${food.totalCal} kcal
</span>

</div>

<button
class="remove-btn"
onclick="removeFood('${type}',${index})"
>
X
</button>

</div>

`).join("")}

</div>

</div>

`;

meals[type].forEach(food=>{

totalCal += food.totalCal;
totalProtein += food.totalProtein;
totalCarb += food.totalCarb;
totalFat += food.totalFat;

});

});

document.getElementById("totalCal")
.innerText = totalCal + " kcal";

document.getElementById("totalProtein")
.innerText = totalProtein + "g";

document.getElementById("totalCarb")
.innerText = totalCarb + "g";

document.getElementById("totalFat")
.innerText = totalFat + "g";

updateProgress(totalCal);

}

/* ================= TARGET ================= */

function getTarget(){

const weight =
parseFloat(document.getElementById("weight").value)||60;

const height =
parseFloat(document.getElementById("height").value)||170;

const activity =
parseFloat(document.getElementById("activity").value);

const bmr =
10*weight + 6.25*height - 5*20 + 5;

const tdee = bmr*activity;

return Math.round(tdee-300);

}

/* ================= BMI ================= */

function updateBMI(){

const weight =
parseFloat(document.getElementById("weight").value)||60;

const height =
(parseFloat(document.getElementById("height").value)||170)/100;

const bmi = (weight/(height*height)).toFixed(1);

document.getElementById("bmiText")
.innerText = bmi;

}

const target = getTarget();

/* ================= PROGRESS ================= */

function updateProgress(total){

const target = getTarget();

const percent =
Math.min((total/target)*100,100);

document.getElementById("progressBar")
.style.width = percent + "%";

const alert = document.getElementById("alertBox");

if(total>target){

alert.innerHTML = `
<div class="alert bad">
⚠️ Calories hôm nay vượt mục tiêu.
</div>
`;

}else{

alert.innerHTML = `
<div class="alert good">
✅ Calories hôm nay vẫn ổn.
</div>
`;

}

}

/* ================= FAVORITE ================= */

function addFavorite(food){

if(!favorites.find(f=>f.name===food.name)){

favorites.push(food);

localStorage.setItem(
"favorites",
JSON.stringify(favorites)
);

}

renderFavorites();

}

function renderFavorites(){

const wrap =
document.getElementById("favoriteList");

wrap.innerHTML="";

favorites.forEach(food=>{

wrap.innerHTML += `
<div
class="favorite-item"
onclick='addFood(${JSON.stringify(food)})'
>
${food.icon} ${food.name}
</div>
`;

});

}

/* ================= RANDOM MEAL ================= */

function randomMeal(){

Object.keys(meals).forEach(key=>meals[key]=[]);

const healthy =
foods.filter(f=>f.cal<250);

for(let i=0;i<2;i++){

meals.breakfast.push(makeFood(healthy));
meals.lunch.push(makeFood(healthy));
meals.dinner.push(makeFood(healthy));

}

saveData();

renderMeals();

}

function makeFood(list){

const food =
list[Math.floor(Math.random()*list.length)];

return {

...food,

gram:100,

totalCal:food.cal,
totalProtein:food.protein,
totalFat:food.fat,
totalCarb:food.carb

};

}

/* ================= EXPORT ================= */

function exportMeal(){

let html = `
<html>

<head>

<title>Meal Plan</title>

<style>

body{
font-family:Arial;
padding:30px;
background:#f8fafc;
}

.card{
background:white;
padding:20px;
border-radius:18px;
margin-bottom:18px;
box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

h1{
margin-bottom:24px;
}

</style>

</head>

<body>

<h1>📋 Meal Plan</h1>

`;

Object.keys(meals).forEach(type=>{

html += `
<div class="card">

<h2>${type}</h2>
`;

meals[type].forEach(food=>{

html += `
<p>
${food.name} • ${food.gram}g • ${food.totalCal} kcal
</p>
`;

});

html += `</div>`;

});

html += `</body></html>`;

const blob =
new Blob([html],{type:"text/html"});

const a =
document.createElement("a");

a.href = URL.createObjectURL(blob);

a.download = "meal-plan.html";

a.click();

}
