<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Nutrition Community</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Be Vietnam Pro',sans-serif;
}

body{
background:#f4f7fb;
color:#1e293b;
padding:20px;
}

.container{
max-width:1400px;
margin:auto;
}

.header{
background:white;
border-radius:24px;
padding:24px;
box-shadow:0 10px 30px rgba(0,0,0,0.06);
margin-bottom:20px;
}

.title{
font-size:32px;
font-weight:700;
margin-bottom:10px;
}

.sub{
color:#64748b;
margin-bottom:24px;
}

.grid-top{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:14px;
}

.input-box{
background:#f8fafc;
border:1px solid #e2e8f0;
padding:14px;
border-radius:16px;
}

.input-box label{
font-size:13px;
color:#64748b;
display:block;
margin-bottom:8px;
}

.input-box input,
.input-box select{
width:100%;
padding:12px;
border:none;
background:white;
border-radius:12px;
outline:none;
font-size:15px;
}

.smart-box{
margin-top:18px;
background:linear-gradient(135deg,#4f46e5,#7c3aed);
padding:18px;
border-radius:20px;
color:white;
}

.smart-box h3{
margin-bottom:10px;
}

.main{
display:grid;
grid-template-columns:1.2fr 0.8fr;
gap:20px;
}

@media(max-width:1000px){
.main{
grid-template-columns:1fr;
}
}

.card{
background:white;
border-radius:24px;
padding:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

.section-title{
font-size:22px;
font-weight:700;
margin-bottom:18px;
}

.search{
width:100%;
padding:14px;
border-radius:16px;
border:none;
background:#f1f5f9;
margin-bottom:20px;
font-size:15px;
}

.food-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:12px;
}

.food-card{
background:#f8fafc;
border:1px solid #e2e8f0;
border-radius:18px;
padding:14px;
transition:0.2s;
}

.food-card:hover{
transform:translateY(-3px);
}

.food-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.food-name{
font-weight:700;
font-size:15px;
}

.food-cat{
font-size:12px;
color:#64748b;
margin-top:4px;
}

.food-cal{
font-size:14px;
font-weight:600;
color:#7c3aed;
margin:10px 0;
}

.food-actions{
display:flex;
gap:8px;
}

.food-actions button{
flex:1;
border:none;
padding:10px;
border-radius:12px;
cursor:pointer;
font-weight:600;
font-size:13px;
}

.add-btn{
background:#4f46e5;
color:white;
}

.fav-btn{
background:#f1f5f9;
}

.meal-tabs{
display:flex;
gap:8px;
margin-bottom:18px;
flex-wrap:wrap;
}

.meal-tabs button{
border:none;
padding:10px 14px;
border-radius:12px;
background:#e2e8f0;
cursor:pointer;
font-weight:600;
}

.meal-tabs .active{
background:#4f46e5;
color:white;
}

.meal-list{
display:flex;
flex-direction:column;
gap:12px;
margin-bottom:20px;
}

.meal-item{
background:#f8fafc;
border-radius:16px;
padding:14px;
display:flex;
justify-content:space-between;
align-items:center;
}

.meal-item-left{
display:flex;
flex-direction:column;
gap:4px;
}

.remove-btn{
background:#ef4444;
color:white;
border:none;
padding:8px 12px;
border-radius:10px;
cursor:pointer;
}

.summary{
background:#f8fafc;
padding:18px;
border-radius:20px;
}

.summary h3{
margin-bottom:14px;
}

.summary-row{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.progress{
height:14px;
background:#e2e8f0;
border-radius:999px;
overflow:hidden;
margin-top:14px;
}

.progress-bar{
height:100%;
background:linear-gradient(90deg,#4f46e5,#7c3aed);
width:0%;
}

.export-btn{
width:100%;
margin-top:18px;
border:none;
padding:14px;
background:#111827;
color:white;
font-weight:700;
border-radius:16px;
cursor:pointer;
}

.favorite-wrap{
margin-top:18px;
}

.favorite-list{
display:flex;
flex-wrap:wrap;
gap:10px;
}

.favorite-item{
background:#ede9fe;
padding:10px 14px;
border-radius:999px;
font-size:14px;
font-weight:600;
cursor:pointer;
}

.footer{
margin-top:30px;
text-align:center;
color:#94a3b8;
font-size:14px;
}

.hidden{
display:none;
}

.show-more{
margin-top:18px;
width:100%;
padding:12px;
border:none;
background:#e2e8f0;
border-radius:14px;
cursor:pointer;
font-weight:700;
}

</style>
</head>

<body>

<div class="container">

<div class="header">

<div class="title">
🥗 Nutrition Community
</div>

<div class="sub">
Theo dõi dinh dưỡng • Tính calories • Xây dựng thực đơn thông minh
</div>

<div class="grid-top">

<div class="input-box">
<label>Chiều cao (cm)</label>
<input type="number" id="height" placeholder="170">
</div>

<div class="input-box">
<label>Cân nặng (kg)</label>
<input type="number" id="weight" placeholder="60">
</div>

<div class="input-box">
<label>Muốn giảm (kg)</label>
<input type="number" id="goal" placeholder="5">
</div>

<div class="input-box">
<label>Mức vận động</label>
<select id="activity">
<option value="1.2">Ít vận động</option>
<option value="1.375">Vận động nhẹ</option>
<option value="1.55">Vận động vừa</option>
<option value="1.725">Vận động nhiều</option>
</select>
</div>

</div>

<div class="smart-box">

<h3>🎯 Gợi ý thông minh</h3>

<div id="aiResult">
Nhập thông tin để nhận khuyến nghị dinh dưỡng.
</div>

</div>

</div>

<div class="main">

<div class="card">

<div class="section-title">
🍱 Kho thực phẩm
</div>

<input 
type="text" 
class="search"
id="search"
placeholder="Tìm món ăn..."
>

<div class="food-grid" id="foodGrid"></div>

<button class="show-more" id="showMoreBtn">
Xem thêm
</button>

</div>

<div>

<div class="card">

<div class="section-title">
📋 Thực đơn hôm nay
</div>

<div class="meal-tabs">

<button class="active" onclick="setMeal('breakfast',this)">
🌅 Sáng
</button>

<button onclick="setMeal('lunch',this)">
☀️ Trưa
</button>

<button onclick="setMeal('dinner',this)">
🌙 Tối
</button>

<button onclick="setMeal('snack',this)">
🍓 Phụ
</button>

</div>

<div class="meal-list" id="mealList"></div>

<div class="summary">

<h3>📊 Tổng kết</h3>

<div class="summary-row">
<span>Total Calories</span>
<b id="totalCal">0 kcal</b>
</div>

<div class="summary-row">
<span>Protein</span>
<b id="totalProtein">0g</b>
</div>

<div class="summary-row">
<span>Carb</span>
<b id="totalCarb">0g</b>
</div>

<div class="summary-row">
<span>Fat</span>
<b id="totalFat">0g</b>
</div>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

</div>

<button class="export-btn" onclick="exportMeal()">
📥 Xuất thực đơn
</button>

<div class="favorite-wrap">

<div class="section-title" style="font-size:18px">
❤️ Yêu thích
</div>

<div class="favorite-list" id="favoriteList"></div>

</div>

</div>

</div>

<div class="footer">
Created by Bao Hy
</div>

</div>

<script>

/* ================= FOOD DATA ================= */

const foods = [

{name:"Ba chỉ heo",cal:518,protein:9,fat:53,carb:0,cat:"Thịt",icon:"🥓"},
{name:"Nạc vai heo",cal:242,protein:27,fat:14,carb:0,cat:"Thịt",icon:"🥩"},
{name:"Nạc dăm heo",cal:250,protein:25,fat:16,carb:0,cat:"Thịt",icon:"🥩"},
{name:"Thăn heo",cal:143,protein:21,fat:6,carb:0,cat:"Thịt",icon:"🥩"},
{name:"Sườn non",cal:277,protein:18,fat:23,carb:0,cat:"Thịt",icon:"🍖"},
{name:"Chân giò",cal:290,protein:20,fat:24,carb:0,cat:"Thịt",icon:"🍖"},
{name:"Da heo",cal:544,protein:9,fat:58,carb:0,cat:"Thịt",icon:"🥓"},
{name:"Tim heo",cal:153,protein:16,fat:9,carb:0,cat:"Thịt",icon:"❤️"},
{name:"Gan heo",cal:165,protein:26,fat:5,carb:3,cat:"Thịt",icon:"🩸"},
{name:"Óc heo",cal:143,protein:11,fat:10,carb:1,cat:"Thịt",icon:"🧠"},
{name:"Ruột heo",cal:168,protein:15,fat:11,carb:0,cat:"Thịt",icon:"🥩"},

{name:"Thăn bò",cal:187,protein:27,fat:8,carb:0,cat:"Thịt",icon:"🥩"},
{name:"Bắp bò",cal:201,protein:28,fat:9,carb:0,cat:"Thịt",icon:"🥩"},
{name:"Nạm bò",cal:250,protein:25,fat:17,carb:0,cat:"Thịt",icon:"🥩"},
{name:"Gầu bò",cal:310,protein:22,fat:25,carb:0,cat:"Thịt",icon:"🥩"},
{name:"Gân bò",cal:125,protein:21,fat:4,carb:0,cat:"Thịt",icon:"🥩"},
{name:"Tim bò",cal:112,protein:17,fat:4,carb:0,cat:"Thịt",icon:"❤️"},
{name:"Gan bò",cal:135,protein:20,fat:5,carb:3,cat:"Thịt",icon:"🩸"},
{name:"Lưỡi bò",cal:224,protein:16,fat:18,carb:0,cat:"Thịt",icon:"🥩"},

{name:"Ức gà",cal:165,protein:31,fat:3,carb:0,cat:"Thịt",icon:"🍗"},
{name:"Đùi gà",cal:215,protein:27,fat:11,carb:0,cat:"Thịt",icon:"🍗"},
{name:"Cánh gà",cal:290,protein:27,fat:20,carb:0,cat:"Thịt",icon:"🍗"},
{name:"Da gà",cal:450,protein:20,fat:40,carb:0,cat:"Thịt",icon:"🍗"},
{name:"Chân gà",cal:215,protein:19,fat:15,carb:0,cat:"Thịt",icon:"🍗"},
{name:"Gan gà",cal:119,protein:17,fat:5,carb:1,cat:"Thịt",icon:"🍗"},
{name:"Trứng gà",cal:155,protein:13,fat:11,carb:1,cat:"Thịt",icon:"🥚"},

{name:"Cá hồi",cal:208,protein:20,fat:13,carb:0,cat:"Cá",icon:"🐟"},
{name:"Cá basa",cal:120,protein:20,fat:4,carb:0,cat:"Cá",icon:"🐟"},
{name:"Cá thu",cal:205,protein:19,fat:14,carb:0,cat:"Cá",icon:"🐟"},
{name:"Cá ngừ",cal:132,protein:28,fat:1,carb:0,cat:"Cá",icon:"🐟"},
{name:"Cá rô phi",cal:128,protein:26,fat:2,carb:0,cat:"Cá",icon:"🐟"},
{name:"Cá lóc",cal:97,protein:20,fat:2,carb:0,cat:"Cá",icon:"🐟"},
{name:"Cá nục",cal:180,protein:22,fat:10,carb:0,cat:"Cá",icon:"🐟"},
{name:"Cá cơm",cal:210,protein:29,fat:10,carb:0,cat:"Cá",icon:"🐟"},
{name:"Cá trê",cal:144,protein:18,fat:8,carb:0,cat:"Cá",icon:"🐟"},

{name:"Tôm",cal:99,protein:24,fat:1,carb:0,cat:"Hải sản",icon:"🦐"},
{name:"Mực",cal:92,protein:16,fat:1,carb:3,cat:"Hải sản",icon:"🦑"},
{name:"Bạch tuộc",cal:82,protein:15,fat:1,carb:2,cat:"Hải sản",icon:"🐙"},
{name:"Cua",cal:97,protein:19,fat:1,carb:0,cat:"Hải sản",icon:"🦀"},
{name:"Ghẹ",cal:87,protein:18,fat:1,carb:0,cat:"Hải sản",icon:"🦀"},
{name:"Hàu",cal:68,protein:7,fat:2,carb:4,cat:"Hải sản",icon:"🦪"},
{name:"Sò huyết",cal:74,protein:13,fat:1,carb:2,cat:"Hải sản",icon:"🦪"}

];

/* ================= APP ================= */

let visibleFoods = 20;
let currentMeal = "breakfast";

let meals = {
breakfast:[],
lunch:[],
dinner:[],
snack:[]
};

let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

function renderFoods(){

const grid = document.getElementById("foodGrid");
grid.innerHTML="";

const search = document.getElementById("search").value.toLowerCase();

const filtered = foods.filter(f=>
f.name.toLowerCase().includes(search)
);

filtered.slice(0,visibleFoods).forEach(food=>{

grid.innerHTML += `
<div class="food-card">

<div class="food-top">
<div>
<div class="food-name">
${food.icon} ${food.name}
</div>
<div class="food-cat">
${food.cat}
</div>
</div>
</div>

<div class="food-cal">
${food.cal} kcal / 100g
</div>

<div class="food-actions">

<button class="add-btn"
onclick='addFood(${JSON.stringify(food)})'>
Thêm
</button>

<button class="fav-btn"
onclick='addFavorite(${JSON.stringify(food)})'>
❤️
</button>

</div>

</div>
`;

});

}

function addFood(food){

const gram = prompt(`Nhập số gram cho ${food.name}`);

if(!gram) return;

const factor = gram/100;

meals[currentMeal].push({
...food,
gram:gram,
totalCal:Math.round(food.cal*factor),
totalProtein:Math.round(food.protein*factor),
totalFat:Math.round(food.fat*factor),
totalCarb:Math.round(food.carb*factor)
});

renderMeal();

}

function renderMeal(){

const list = document.getElementById("mealList");

list.innerHTML="";

let totalCal=0;
let totalProtein=0;
let totalFat=0;
let totalCarb=0;

Object.keys(meals).forEach(type=>{

meals[type].forEach((food,index)=>{

totalCal += food.totalCal;
totalProtein += food.totalProtein;
totalFat += food.totalFat;
totalCarb += food.totalCarb;

list.innerHTML += `
<div class="meal-item">

<div class="meal-item-left">
<b>${food.icon} ${food.name}</b>
<span>${food.gram}g • ${food.totalCal} kcal • ${type}</span>
</div>

<button class="remove-btn"
onclick="removeFood('${type}',${index})">
X
</button>

</div>
`;

});

});

document.getElementById("totalCal").innerText =
totalCal + " kcal";

document.getElementById("totalProtein").innerText =
totalProtein + "g";

document.getElementById("totalFat").innerText =
totalFat + "g";

document.getElementById("totalCarb").innerText =
totalCarb + "g";

const target = calculateCalories();

const percent = Math.min((totalCal/target)*100,100);

document.getElementById("progressBar").style.width =
percent + "%";

}

function removeFood(type,index){
meals[type].splice(index,1);
renderMeal();
}

function setMeal(type,btn){

currentMeal = type;

document.querySelectorAll(".meal-tabs button")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

}

function calculateCalories(){

const weight =
parseFloat(document.getElementById("weight").value)||60;

const height =
parseFloat(document.getElementById("height").value)||170;

const activity =
parseFloat(document.getElementById("activity").value);

const bmr =
10*weight + 6.25*height - 5*20 + 5;

const tdee = bmr*activity;

return Math.round(tdee-300);

}

function updateAI(){

const target = calculateCalories();

document.getElementById("aiResult").innerHTML = `
🔥 Calories mục tiêu:
<b>${target} kcal/ngày</b>

<br><br>

🥩 Protein nên ăn:
<b>${Math.round(target*0.3/4)}g</b>

<br>

🍚 Carb:
<b>${Math.round(target*0.4/4)}g</b>

<br>

🥑 Fat:
<b>${Math.round(target*0.3/9)}g</b>

<br><br>

💡 Gợi ý:
- Ưu tiên đạm nạc
- Ăn nhiều rau
- Hạn chế trà sữa & mì gói
- Uống đủ nước
`;
}

function addFavorite(food){

if(!favorites.find(f=>f.name===food.name)){
favorites.push(food);
localStorage.setItem(
"favorites",
JSON.stringify(favorites)
);
}

renderFavorites();

}

function renderFavorites(){

const wrap =
document.getElementById("favoriteList");

wrap.innerHTML="";

favorites.forEach(food=>{

wrap.innerHTML += `
<div class="favorite-item"
onclick='addFood(${JSON.stringify(food)})'>
${food.icon} ${food.name}
</div>
`;

});

}

function exportMeal(){

let text = `
THỰC ĐƠN HÔM NAY

`;

Object.keys(meals).forEach(type=>{

text += `
${type.toUpperCase()}
`;

meals[type].forEach(food=>{

text += `
- ${food.name}
${food.gram}g
${food.totalCal} kcal
`;

});

});

const blob = new Blob([text],{
type:"text/plain"
});

const a = document.createElement("a");

a.href = URL.createObjectURL(blob);

a.download = "thuc-don.txt";

a.click();

}

document
.getElementById("showMoreBtn")
.onclick = ()=>{

visibleFoods += 20;
renderFoods();

};

document
.getElementById("search")
.addEventListener("input",renderFoods);

document
.querySelectorAll("input,select")
.forEach(el=>
el.addEventListener("input",updateAI)
);

renderFoods();
renderMeal();
renderFavorites();
updateAI();

</script>

</body>
</html>
